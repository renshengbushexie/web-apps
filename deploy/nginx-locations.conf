# Include inside the TLS server block that fronts the Rust API.
location = / {
    access_log off;
    proxy_set_header Host $host;
    proxy_pass http://127.0.0.1:8022;
}
location ~ ^/(auth/feishu/(login|callback)|auth/logout|me/(tables|fields|records)|workbench\.css)$ {
    access_log off;
    proxy_set_header Host $host;
    proxy_pass http://127.0.0.1:8022;
}
location = /healthz {
    proxy_pass http://127.0.0.1:8022;
}
location ~ ^/v1/(sku|search|compare)$ {
    client_max_body_size 8k;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_buffering off;
    proxy_read_timeout 55s;
    proxy_pass http://127.0.0.1:8022;
}
location ^~ /v1/admin/ {
    return 404;
}
